<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Colors of Finn">
<meta name="theme-color" content="#f3efe6">
<title>Colors of Finn</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f3efe6;font-family:"Trebuchet MS",system-ui,sans-serif;color:#6b6358;
touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#game{position:fixed;inset:0}
#hud{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:22px;opacity:.85;pointer-events:none}
#stars{color:#e3c77a;letter-spacing:4px}
.item{position:absolute;transition:transform .5s ease,opacity .8s ease}
.target{opacity:.9}
.piece{cursor:grab;filter:drop-shadow(0 3px 4px rgba(0,0,0,.12))}
.piece.drag{transition:none;transform:scale(1.08)}
.done{transform:scale(1)}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,250,230,.9),rgba(255,250,230,0) 70%);pointer-events:none;opacity:0;transition:opacity .9s ease}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f3efe6;z-index:10;text-align:center;transition:opacity .8s ease}
#start button{font:inherit;font-size:clamp(28px,6vw,54px);color:#fff;background:#9db8a8;border:0;border-radius:40px;padding:28px 56px;box-shadow:0 6px 0 #83a090}
#start p{font-size:18px;opacity:.7}
#rotate{display:none;font-size:26px}
@media (orientation:portrait){#rotate{display:flex}}
#msg{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:clamp(30px,6vw,56px);opacity:0;transition:opacity .9s ease;pointer-events:none;color:#8a9f92}
</style></head><body>
<div id="game"><div id="hud"><span id="lvl">Level 1</span> &nbsp;<span id="stars"></span><div id="stage" style="font-size:16px;opacity:.7"></div></div><div id="msg">Great job, Finn!</div></div>
<div id="start" class="ov"><button id="go">Colors of Finn</button><p>Tap to play</p></div>
<div id="rotate" class="ov"><div style="font-size:60px">↻</div>Please turn your phone sideways</div>
<script>
const COLORS={red:'#e59a92',blue:'#8fb3d9',yellow:'#ecd68a',green:'#9cc9a0',orange:'#f0b88a',purple:'#b9a3d4'};
const SHAPES=['circle','square','triangle','star','heart'];
function path(s){switch(s){
case'circle':return'<circle cx="50" cy="50" r="44"/>';
case'square':return'<rect x="8" y="8" width="84" height="84" rx="12"/>';
case'triangle':return'<path d="M50 8 L94 88 L6 88 Z" stroke-linejoin="round"/>';
case'star':{let p='';for(let i=0;i<10;i++){const r=i%2?20:46,a=Math.PI/5*i-Math.PI/2;p+=(i?'L':'M')+(50+r*Math.cos(a)).toFixed(1)+' '+(54+r*Math.sin(a)).toFixed(1)}return'<path d="'+p+'Z" stroke-linejoin="round"/>'}
case'heart':return'<path d="M50 88 C10 60 4 34 20 20 C34 8 48 16 50 28 C52 16 66 8 80 20 C96 34 90 60 50 88Z"/>';}}
function svg(s,c,outline){return`<svg viewBox="0 0 100 100" width="100%" height="100%">${outline?`<g fill="${c}" fill-opacity=".18" stroke="${c}" stroke-width="5" stroke-dasharray="9 7">`:`<g fill="${c}" stroke="#fff" stroke-opacity=".5" stroke-width="2">`}${path(s)}</g></svg>`}
// level design: slow progression
const STAGES=['Colors','Shapes','Colors & Shapes','Big & Little','Put It All Together','Play Time'];
const PROMPTS=['Match the colors!','Match the shapes!','Match the colors and shapes!','Find big and little!','Look at the color, shape, and size!',"Let's play!"];
// each level: [stage, 'shape color size, ...', shuffle]
const PLAN=[
 [0,'circle red b'],[0,'circle blue b'],[0,'circle yellow b'],[0,'circle red b,circle blue b'],[0,'circle blue b,circle yellow b'],[0,'circle yellow b,circle red b',1],[0,'circle red b,circle blue b,circle yellow b',1],
 [1,'square blue b'],[1,'triangle blue b'],[1,'circle blue b,square blue b'],[1,'square blue b,triangle blue b'],[1,'triangle blue b,circle blue b',1],[1,'star blue b,circle blue b',1],[1,'heart blue b,square blue b',1],[1,'circle blue b,star blue b,heart blue b',1],
 [2,'circle red b,square blue b'],[2,'triangle yellow b,circle green b',1],[2,'star orange b,heart blue b',1],[2,'heart purple b,square green b',1],[2,'circle red b,triangle green b,star yellow b',1],[2,'square orange b,heart purple b,circle blue b',1],[2,'circle red b,circle green b,square red b',1],[2,'star yellow b,heart red b,triangle purple b,square orange b',1],
 [3,'circle red b,circle red s'],[3,'square blue s,square blue b'],[3,'star yellow b,star yellow s',1],[3,'triangle green s,triangle green b',1],[3,'heart purple b,heart purple s',1],[3,'circle orange s,circle orange b',1],
 [4,'circle red b,circle red s,square blue b',1],[4,'star yellow s,star yellow b,heart purple s',1],[4,'triangle green b,triangle green s,circle orange b',1],[4,'circle blue b,circle blue s,square red b,square red s',1],[4,'heart purple b,heart red s,heart purple s,star green b',1],[4,'circle yellow s,circle yellow b,triangle orange s,triangle orange b',1],[4,'square green b,square green s,star blue b,star blue s,circle red s',1],[4,'heart red b,heart red s,circle purple b,circle purple s,triangle yellow b',1]];
function levelSpec(n){
 if(n<=PLAN.length){const[st,str,sh]=PLAN[n-1];return{st,items:str.split(',').map(x=>{const[s,c,z]=x.split(' ');return{s,c,z}}),shuffle:sh?1:0,sized:st>=3}}
 const cn=Object.keys(COLORS),k=3+((n-PLAN.length)%3),items=[],used=new Set();
 while(items.length<k){const s=SHAPES[Math.random()*5|0],c=cn[Math.random()*6|0];
  if(!used.has(s+c)){used.add(s+c);if(items.length<k-1&&Math.random()<.5){items.push({s,c,z:'b'},{s,c,z:'s'})}else items.push({s,c,z:Math.random()<.5?'b':'s'})}}
 return{st:5,items,shuffle:1,sized:true};
}
let voice=null,lastSay='',lastT=0;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/^en[-_]US/i.test(x.lang)&&/samantha|google|female/i.test(x.name))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,force){if(!('speechSynthesis' in window))return;const n=Date.now();if(!force&&t===lastSay&&n-lastT<1000)return;lastSay=t;lastT=n;
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.85;u.pitch=1.05;u.volume=.7;u.lang='en-US';if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){}}
const BUF={};
function clip(n){return n.replace(/ /g,'-')}
function loadAudio(){if(!actx)return;const names=[];Object.keys(COLORS).forEach(c=>SHAPES.forEach(sh=>['','big-','little-'].forEach(p=>names.push(p+c+'-'+sh))));for(let i=0;i<6;i++)names.push('p'+i,'s'+i);
 names.forEach(n=>fetch('audio/'+n+'.mp3').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(b=>new Promise((ok,no)=>actx.decodeAudioData(b,ok,no))).then(d=>BUF[n]=d).catch(()=>{}))}
let cur=null,first=1;
function speak(file,text,force){const n=Date.now();if(!force&&file===lastSay&&n-lastT<1000)return;
 if(actx&&BUF[file]){lastSay=file;lastT=n;try{if(cur)cur.stop()}catch(e){}try{speechSynthesis.cancel()}catch(e){}
  const src=actx.createBufferSource(),g=actx.createGain();g.gain.value=.8;src.buffer=BUF[file];src.connect(g).connect(actx.destination);src.start();cur=src}
 else{say(text,force);lastSay=file}}
let level=+localStorage.getItem('cof_v2_level')||0;
if(!level){const o=+localStorage.getItem('cof_level')||1;level=o>=18?24:o>=9?16:o>=4?8:1;localStorage.setItem('cof_v2_level',level)}
let actx,pieces=[],left=0;
const G=document.getElementById('game');
function tone(f,d=.5,v=.06,type='sine',f2){if(!actx)return;const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.05)}
const sPick=()=>tone(660,.25,.03),sMatch=()=>{tone(523,.7,.05);setTimeout(()=>tone(784,.9,.04),150)},
 sWrong=()=>tone(220,.35,.04,'sine',170),sDone=()=>[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,1.1,.04),i*260));
function hud(){document.getElementById('lvl').textContent='Level '+level;document.getElementById('stage').textContent=STAGES[levelSpec(level).st];document.getElementById('stars').textContent='★'.repeat(Math.min(5,((level-1)%5)+1))}
function build(){
 G.querySelectorAll('.item,.glow').forEach(e=>e.remove());hud();
 const W=innerWidth,H=innerHeight,spec=levelSpec(level);clearTimeout(window._pt);window._pt=setTimeout(()=>speak('s'+spec.st,PROMPTS[spec.st],1),first?1500:700);first=0;const k=spec.items.length;
 const BIG=Math.max(110,Math.min(H*.34,W/(k+.6)*.9,180)),SM=Math.max(70,BIG*.6);left=k;pieces=[];
 const slot=i=>(W/(k))*(i+.5);
 let order=[...Array(k).keys()];if(spec.shuffle)for(let i=k-1;i>0;i--){const j=Math.random()*(i+1)|0;[order[i],order[j]]=[order[j],order[i]]}
 if(spec.shuffle&&k>1&&order.every((v,i)=>v===i))order.reverse();
 spec.items.forEach((it,i)=>{const size=it.z==='s'?SM:BIG;
  const t=document.createElement('div');t.className='item target';t.innerHTML=svg(it.s,COLORS[it.c],1);
  Object.assign(t.style,{width:size+'px',height:size+'px',left:slot(i)-size/2+'px',top:H*.27-size/2+'px'});G.appendChild(t);
  const p=document.createElement('div');p.className='item piece';p.innerHTML=svg(it.s,COLORS[it.c]);
  const hx=slot(order.indexOf(i))-size/2,hy=H*.74-size/2;
  Object.assign(p.style,{width:size+'px',height:size+'px',left:hx+'px',top:hy+'px',opacity:0});G.appendChild(p);
  requestAnimationFrame(()=>p.style.opacity=1);
  const o={p,t,hx,hy,size,key:it.s+it.c+it.z,name:(spec.sized?(it.z==='s'?'little ':'big '):'')+it.c+' '+it.s,done:0};pieces.push(o);drag(o);
 });
}
function drag(o){
 let dx,dy,id=null;const p=o.p;
 p.addEventListener('pointerdown',e=>{if(o.done||id!==null)return;e.preventDefault();id=e.pointerId;p.setPointerCapture(id);
  const r=p.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;p.classList.add('drag');p.style.zIndex=5;sPick();speak(clip(o.name),o.name)});
 p.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;e.preventDefault();p.style.left=e.clientX-dx+'px';p.style.top=e.clientY-dy+'px'});
 const up=e=>{if(e.pointerId!==id)return;id=null;p.classList.remove('drag');p.style.zIndex='';
  const px=parseFloat(p.style.left)+o.size/2,py=parseFloat(p.style.top)+o.size/2;let hit=null,best=1e9;
  pieces.forEach(q=>{if(q.done)return;const r=q.t.getBoundingClientRect(),d=Math.hypot(px-r.left-r.width/2,py-r.top-r.height/2);if(d<Math.max(o.size,r.width)*.85&&d<best){best=d;hit=q}});
  p.style.transition='left .6s ease,top .6s ease';
  if(hit&&hit.key===o.key){const r=hit.t.getBoundingClientRect();p.style.left=r.left+(r.width-o.size)/2+'px';p.style.top=r.top+(r.height-o.size)/2+'px';hit.matchedBy=o;o.done=hit.done=0;o.done=1;hit.t.style.opacity=0;sMatch();glow(r);
   pieces.forEach(q=>{if(q===o)q.done=1});if(--left===0)setTimeout(win,900)}
  else{if(hit)sWrong();p.style.left=o.hx+'px';p.style.top=o.hy+'px'}
  setTimeout(()=>p.style.transition='',650)};
 p.addEventListener('pointerup',up);p.addEventListener('pointercancel',up);
}
function glow(r){const g=document.createElement('div');g.className='glow';const s=r.width*1.6;Object.assign(g.style,{width:s+'px',height:s+'px',left:r.left+r.width/2-s/2+'px',top:r.top+r.height/2-s/2+'px'});G.appendChild(g);
 requestAnimationFrame(()=>{g.style.opacity=1;setTimeout(()=>g.style.opacity=0,700);setTimeout(()=>g.remove(),1700)})}
const PHR=['Great job Finn!',"You're so smart!",'Way to go Finn!','You did it!','Awesome matching, Finn!','Wonderful work!'];let lastP=-1;
function win(){sDone();let pi;do{pi=Math.random()*PHR.length|0}while(pi===lastP);lastP=pi;setTimeout(()=>speak('p'+pi,PHR[pi],1),900);const m=document.getElementById('msg');m.style.opacity=1;
 setTimeout(()=>{m.style.opacity=0;G.querySelectorAll('.piece').forEach(e=>e.style.opacity=0)},1800);
 setTimeout(()=>{level++;localStorage.setItem('cof_v2_level',level);build()},2700)}
document.getElementById('go').onclick=()=>{try{if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);pickVoice()}}catch(e){}try{actx=new (window.AudioContext||window.webkitAudioContext)();actx.resume();loadAudio()}catch(e){}
 const s=document.getElementById('start');s.style.opacity=0;setTimeout(()=>s.remove(),800);
 try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{})}catch(e){}
 build()};
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!document.getElementById('start'))build()},300)});
hud();
</script></body></html>
